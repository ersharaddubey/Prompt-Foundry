<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f12" />
  <title>Prompt Foundry</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f0f12;color:#fff;font:16px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(100%,440px);background:#1a1a1f;border:1px solid #2a2a32;border-radius:22px;padding:28px;text-align:center;box-shadow:0 18px 60px #0008}.mark{width:58px;height:58px;border-radius:18px;margin:0 auto 18px;background:linear-gradient(135deg,#7c3aed,#c026d3);display:grid;place-items:center;font-size:27px;font-weight:800}.muted{color:#9ca3af;line-height:1.55}.btn{width:100%;border:0;border-radius:13px;padding:15px 18px;margin-top:20px;background:#7c3aed;color:white;font-weight:700;font-size:16px}.status{margin-top:18px;color:#c4b5fd;min-height:24px}.error{color:#fca5a5}.small{font-size:12px;color:#71717a;margin-top:18px}
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark">PF</div>
    <h1 id="heading">Prompt Foundry</h1>
    <p id="description" class="muted">Secure sign-in with your Puter account.</p>
    <button id="action" class="btn">Continue with Puter</button>
    <div id="status" class="status" role="status"></div>
    <p class="small">Your Puter account controls its own AI usage and storage.</p>
  </main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') || 'login';
  const worker = (params.get('worker') || '').replace(/\/$/, '');
  const prompt = params.get('prompt') || '';
  const ratio = params.get('ratio') || '3:4';
  const inputImageUrl = params.get('inputImageUrl') || '';
  const action = document.getElementById('action');
  const status = document.getElementById('status');
  const heading = document.getElementById('heading');
  const description = document.getElementById('description');
  let busy = false;

  function setStatus(message, isError=false) {
    status.textContent = message;
    status.className = isError ? 'status error' : 'status';
  }
  const redirect = params.get('redirect') || '';
  function safeRedirect(u) {
    // Sirf app ke apne schemes allowed hain (open redirect se bachne ke liye)
    return /^(somyalaya|exp|exps):\/\//i.test(u);
  }
  function finish(values) {
    if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'success', data: values }));
      return;
    }
    if (redirect && safeRedirect(redirect)) {
      const target = redirect + (redirect.includes('?') ? '&' : '?') + new URLSearchParams(values).toString();
      setStatus('Done! Returning to Prompt Foundry…');
      action.style.display = 'block';
      action.disabled = false;
      action.textContent = 'Return to Prompt Foundry';
      action.onclick = () => { window.location.href = target; };
      window.location.href = target;
      return;
    }
    setStatus('This page must be opened from the Prompt Foundry app.', true);
  }
  async function ensurePuter() {
    if (!window.puter) {
      throw new Error('Puter service did not load. Check your internet connection.');
    }

    if (!puter.auth.isSignedIn()) {
      setStatus('Opening secure Puter sign-in dialog…');

      if (!puter.ui || typeof puter.ui.authenticateWithPuter !== 'function') {
        throw new Error('Puter authentication dialog is unavailable in this SDK.');
      }

      await puter.ui.authenticateWithPuter();
    }

    if (!puter.auth.isSignedIn()) {
      throw new Error('Puter sign-in did not complete. Please try again.');
    }

    setStatus('Puter authenticated. Creating your secure session…');
  }
  async function run() {
    if (busy) return;
    busy = true;
    action.disabled = true;
    action.textContent = 'Please wait…';
    try {
      if (!worker || !/^https:\/\//.test(worker)) throw new Error('Puter Worker URL is not configured in the app.');
      await ensurePuter();
      if (mode === 'generate') {
        if (!prompt.trim()) throw new Error('Prompt is empty. Go back and enter a prompt.');
        setStatus('Generating your image with your Puter account…');
        const response = await puter.workers.exec(worker + '/generate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, ratio, inputImageUrl })
        });
        const data = await response.json();
        if (!response.ok || !data.imageUrl) throw new Error(data.message || 'Image generation failed.');
        finish({ imageUrl: data.imageUrl, storagePath: data.storagePath || '', model: data.model || 'puter-user-pays' });
      } else {
        setStatus('Creating your secure Prompt Foundry session…');
        const response = await puter.workers.exec(worker + '/session', { method: 'POST' });
        const data = await response.json();
        if (!response.ok || !data.code) throw new Error(data.message || 'Could not create secure session.');
        finish({ code: data.code });
      }
    } catch (error) {
      setStatus(error?.msg || error?.message || 'Authorization failed. Please try again.', true);
      busy = false;
      action.disabled = false;
      action.textContent = mode === 'generate' ? 'Try generation again' : 'Continue with Puter';
    }
  }

  if (mode === 'generate') {
    heading.textContent = 'Create your image';
    description.textContent = 'Your prompt is processed through your own Puter account. Usage is billed by Puter, not Prompt Foundry.';
    action.textContent = 'Generate image';
  }
  action.addEventListener('click', run);
  // Existing browser session: no second sign-in prompt is needed.
  window.addEventListener('load', () => {
    if (window.puter && puter.auth.isSignedIn()) run();
  });
})();
</script>
</body>
</html>
